<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		body{
			background: lightgrey;
		}
		#container{
			width: 1200px;
			height: 400px;
			margin: auto;
			margin-top: 100px;
			display: flex;
			justify-content: space-between;
		}

		.carte{
			width: 350px;
			height: 100%;
			border-radius: 10px;
			box-shadow: 1px 1px 10px grey;
			background: white;
		}

		.carte .entete{
			width: 100%;
			height: 55%;
			border-radius: 10px 10px 0px 0px;
		}

		.entete img{
			width: 100%;
			height: 100%;
			border-radius: 10px 10px 0px 0px;
		}

		.carte .corps{
			width: 100%;
			height: 45%;
			border-radius: 0px 0px 10px 10px;
			padding: 0px 20px;
			box-sizing: border-box;
		}

		h4, p{
			color: grey;
		} 

		a{
			color: deeppink;
			text-decoration: none;
		}

		.author{
			text-align: center;
		}

		.logo{
			text-align: right;
			padding-right: 150px;
		}

		.logo img{
			width: 50px;
			height: 30px;
		}
	</style>
</head>
<body>
	<div id="container">
		<!-- premiere carte -->
		<div class="carte">
			<div class="entete">
				<img src="../images/img1.jpg" alt="">
			</div>
			<div class="corps">
				<h4>TIGER</h4>
				<h3>Lorem, ipsum, dolor.</h3>
				<p>
					Lorem, ipsum dolor sit amet consectetur. <br>

				</p>
				<span>
					by <a href="">Cohorte 15</a>
				</span>
			</div>
		</div>
		<!-- deuxieme carte -->
		<div class="carte">
			<div class="entete">
				<img src="../images/img2.jpg" alt="">
			</div>
			<div class="corps">
				<h4>SUNSET</h4>
				<h3>Lorem, ipsum, dolor.</h3>
				<p>
					Lorem, ipsum dolor sit amet consectetur. <br>

				</p>
				<span>
					by <a href="">Cohorte 15</a>
				</span>
			</div>
		</div>
		<!-- troisieme carte  -->
		<div class="carte">
			<div class="entete">
				<img src="../images/img3.jpg" alt="">
			</div>
			<div class="corps">
				<h4>THUNDER</h4>
				<h3>Lorem, ipsum, dolor.</h3>
				<p>
					Lorem, ipsum dolor sit amet consectetur. <br>

				</p>
				<span>
					by <a href="">Cohorte 15</a>
				</span>
			</div>
		</div>
	</div>
	<p class="author">Made with 🖤 by <strong>Cohorte 15</strong></p>
	<div class="logo">
		<img src="../images/icon.png" alt=""><strong>COHORTE15</strong>
	</div>
</body>
</html>
