<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		body{
			margin: 0px;
		}
		#navbar{
			height: 50px;
			box-shadow: 1px 1px 3px black;
		}
		.logo{
			display: inline-block;
			font-size: 38px;
			font-family: Algerian;
			text-shadow: 1px 1px 1px yellow;
		}
		ul{
			display: inline-block;
			list-style-type: none;
			float: right;
			margin-top: 5px;
		}
		ul li{
			display: inline-block;
			padding: 8px 20px;
			font-size: 18px;
			font-weight: bold;

		}

		ul li:hover{
			transition: 2s;
			background: purple;

		}
		ul li a{
			text-decoration: none;
			text-shadow: 1px 1px 1px purple;
		}

		ul li:hover a{
			color: yellow;
		}
	</style>
</head>
<body>
	<nav id="navbar">
		<div class="logo">cohorte15</div>
		<ul>
			<li><a href="">Accueil</a></li>
			<li><a href="">Apropos</a></li>
			<li><a href="">Formations</a></li>
			<li><a href="">Competences</a></li>
			<li><a href="">Contact</a></li>
		</ul>
	</nav>
</body>
</html>
