<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		#div1{
			border: 10px groove sandybrown;
			width: 200px;
			margin-left: 100px;
			font-size: 	30px;
			font-family: verdana;
			padding: 10px 30px;
			color: sandybrown;
			text-shadow: 	1px 	1px 	1px #000;
			margin-bottom: 	50px;
		}

		#div2{
			width: 150px;
			text-align: center;	
			font-family: Algerian;
			padding: 10px 30px;
			border-bottom-right-radius: 20px;
			box-shadow: 2px 2px 5px red, -2px -2px 5px red;
			text-shadow: 2px 2px 5px red;
		}

		#div2:hover{
			transition: 4s;
			border-bottom-right-radius: 0px;
			box-shadow: inset -2px -2px 2px purple;
			transform: rotate(-45deg);
		}
	</style>
</head>
<body>
	<div id="div1">Les modèles de boite</div>
	<div id="div2">Transformation</div>
</body>
</html>
